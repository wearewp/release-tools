name: Publication d'un thème

on:
  workflow_call:
    inputs:
      tools-ref:
        description: Version de release-tools utilisée pour les scripts (doit correspondre à la version du workflow).
        type: string
        default: v1.2

permissions:
  contents: read

jobs:
  build:
    name: Contrôles et paquet
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      slug: ${{ steps.meta.outputs.slug }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Code du thème
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: theme
          persist-credentials: false

      - name: Outils de publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wearewp/release-tools
          ref: ${{ inputs.tools-ref }}
          path: tools
          persist-credentials: false

      # Un relèvement de la version minimale sur main s'applique même aux appels épinglés sur un ancien tag.
      - name: Version minimale de wawp-theme-updater exigée sur main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wearewp/release-tools
          ref: main
          path: tools-main
          sparse-checkout: config
          persist-credentials: false

      - name: Slug et version
        id: meta
        run: |
          echo "slug=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Contrôles avant publication
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          ref_min="$(cat tools/config/min-theme-updater-version.txt)"
          main_min="$(cat tools-main/config/min-theme-updater-version.txt)"
          min="$(printf '%s\n%s\n' "$ref_min" "$main_min" | sort -V | tail -n 1)"
          php tools/scripts/check-headers.php --type=theme theme "$SLUG" "$GITHUB_REF_NAME" "$min"

      - name: Syntaxe PHP
        run: find theme -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Dépendances Composer
        if: hashFiles('theme/composer.json') != ''
        working-directory: theme
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Assets
        if: hashFiles('theme/package.json') != ''
        working-directory: theme
        run: npm ci && npm run build

      - name: Paquet
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p "build/$SLUG" dist
          rsync -a --exclude-from=theme/.distignore --exclude=.git --exclude=.github theme/ "build/$SLUG/"
          php tools/scripts/check-package.php --type=theme "build/$SLUG" "$SLUG" "$VERSION"
          (cd build && zip -rqX "../dist/$SLUG-$VERSION.zip" "$SLUG")

      - name: Conservation du paquet
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquet
          path: dist/
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  sign-upload:
    name: Signature et envoi
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: release-upload-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Outils de publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wearewp/release-tools
          ref: ${{ inputs.tools-ref }}
          path: tools
          persist-credentials: false

      - name: Récupération du paquet
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquet
          path: dist

      - name: Installation de lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp > /dev/null

      - name: Signature
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ZIP: dist/${{ needs.build.outputs.slug }}-${{ needs.build.outputs.version }}.zip
        run: php tools/scripts/sign.php "$ZIP"

      - name: Envoi FTPS vers le serveur de mises à jour
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ZIP: dist/${{ needs.build.outputs.slug }}-${{ needs.build.outputs.version }}.zip
        run: bash tools/scripts/upload-ftps.sh "$ZIP"

      - name: Conservation de la signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist/*.sig
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  publish-release:
    name: Archive dans la Release GitHub
    needs: [build, sign-upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Récupération du paquet
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquet
          path: dist

      - name: Récupération de la signature
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for file in dist/*; do
              while IFS= read -r asset; do
                if [ "$asset" = "$(basename "$file")" ]; then
                  echo "La Release $GITHUB_REF_NAME contient déjà $asset : aucun remplacement automatique. Vérifier l'asset existant et le supprimer à la main s'il doit être remplacé, puis relancer le job." >&2
                  exit 1
                fi
              done <<< "$assets"
            done
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Paquet signé publié sur updates.wearewp.pro."
          fi
