name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extensions PHP
        run: |
          php -v
          for ext in json sodium zip curl; do php -m | grep -qx "$ext" || { echo "Extension manquante : $ext"; exit 1; }; done

      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests unitaires
        run: composer test

      - name: Analyse statique
        run: composer stan

      - name: Standards WordPress et compatibilité PHP 7.4
        run: composer cs
